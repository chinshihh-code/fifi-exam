@layer properties;
@layer theme, base, components, utilities;
@layer theme {
:root, :host {
--font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', 'Noto Sans', Arial,
sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji';
--font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New',
monospace;
--color-white: #fff;
--spacing: 0.25rem;
--container-lg: 32rem;
--container-xl: 36rem;
--container-3xl: 48rem;
--container-5xl: 64rem;
--text-xs: 0.75rem;
--text-xs--line-height: calc(1 / 0.75);
--text-sm: 0.875rem;
--text-sm--line-height: calc(1.25 / 0.875);
--text-lg: 1.125rem;
--text-lg--line-height: calc(1.75 / 1.125);
--text-xl: 1.25rem;
--text-xl--line-height: calc(1.75 / 1.25);
--text-2xl: 1.5rem;
--text-2xl--line-height: calc(2 / 1.5);
--text-5xl: 3rem;
--text-5xl--line-height: 1;
--font-weight-medium: 500;
--font-weight-semibold: 600;
--font-weight-bold: 700;
--leading-tight: 1.25;
--leading-relaxed: 1.625;
--radius-sm: 0.25rem;
--radius-md: 0.375rem;
--radius-lg: 0.5rem;
--radius-xl: 0.75rem;
--radius-2xl: 1rem;
--blur-md: 12px;
--default-transition-duration: 150ms;
--default-transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
--default-font-family: var(--font-sans);
--default-mono-font-family: var(--font-mono);
}
}
@layer base {
*, ::after, ::before, ::backdrop, ::file-selector-button {
box-sizing: border-box;
margin: 0;
padding: 0;
border: 0 solid;
}
html, :host {
line-height: 1.5;
-webkit-text-size-adjust: 100%;
tab-size: 4;
font-family: var(--default-font-family, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', 'Noto Sans', Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji');
font-feature-settings: var(--default-font-feature-settings, normal);
font-variation-settings: var(--default-font-variation-settings, normal);
-webkit-tap-highlight-color: transparent;
}
hr {
height: 0;
color: inherit;
border-top-width: 1px;
}
abbr:where([title]) {
-webkit-text-decoration: underline dotted;
text-decoration: underline dotted;
}
h1, h2, h3, h4, h5, h6 {
font-size: inherit;
font-weight: inherit;
}
a {
color: inherit;
-webkit-text-decoration: inherit;
text-decoration: inherit;
}
b, strong {
font-weight: bolder;
}
code, kbd, samp, pre {
font-family: var(--default-mono-font-family, ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace);
font-feature-settings: var(--default-mono-font-feature-settings, normal);
font-variation-settings: var(--default-mono-font-variation-settings, normal);
font-size: 1em;
}
small {
font-size: 80%;
}
sub, sup {
font-size: 75%;
line-height: 0;
position: relative;
vertical-align: baseline;
}
sub {
bottom: -0.25em;
}
sup {
top: -0.5em;
}
table {
text-indent: 0;
border-color: inherit;
border-collapse: collapse;
}
:-moz-focusring:where(:not(iframe)) {
outline: auto;
}
progress {
vertical-align: baseline;
}
summary {
display: list-item;
}
ol, ul, menu {
list-style: none;
}
img, svg, video, canvas, audio, iframe, embed, object {
display: block;
vertical-align: middle;
}
img, video {
max-width: 100%;
height: auto;
}
button, input, select, optgroup, textarea, ::file-selector-button {
font: inherit;
font-feature-settings: inherit;
font-variation-settings: inherit;
letter-spacing: inherit;
color: inherit;
border-radius: 0;
background-color: transparent;
opacity: 1;
}
:where(select:is([multiple], [size])) optgroup {
font-weight: bolder;
}
:where(select:is([multiple], [size])) optgroup option {
padding-inline-start: 20px;
}
::file-selector-button {
margin-inline-end: 4px;
}
::placeholder {
opacity: 1;
}
@supports (not (-webkit-appearance: -apple-pay-button))  or (contain-intrinsic-size: 1px) {
::placeholder {
color: currentcolor;
@supports (color: color-mix(in lab, red, red)) {
color: color-mix(in oklab, currentcolor 50%, transparent);
}
}
}
textarea {
resize: vertical;
}
::-webkit-search-decoration {
-webkit-appearance: none;
}
::-webkit-date-and-time-value {
min-height: 1lh;
text-align: inherit;
}
::-webkit-datetime-edit {
display: inline-flex;
}
::-webkit-datetime-edit-fields-wrapper {

    .qn { min-width:44px; height:42px; padding:0 .5rem; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--muted); font-weight:750; font-variant-numeric: tabular-nums; display:inline-flex; align-items:center; justify-content:center; }

    .ans-btn { width:46px; height:46px; border-radius:12px; border:1px solid var(--line); background:var(--surface); font-weight:800; font-size:1.05rem; color:var(--ink-2); }
    .ans-btn.on { background:var(--ink); border-color:var(--ink); color:#fff; }
    .spin { width:14px; height:14px; border-radius:50%; border:2px solid currentColor; border-right-color:transparent; animation: spin .8s linear infinite; display:inline-block; }

    /* Calendar */
    .cal-cell { min-height:5.2rem; border-radius:14px; border:1px solid var(--line-soft); background:#fff; padding:.35rem .4rem; display:flex; flex-direction:column; gap:.2rem; overflow:hidden; text-align:left; }

    .cal-empty { min-height:5.2rem; }

    /* Review flip */

    .rate-btn { flex:1; display:flex; flex-direction:column; align-items:center; gap:.15rem; padding:.8rem .5rem; border-radius:18px; font-weight:700; border:2px solid transparent; min-height:78px; }

    .rate-hard { background:#f6efdf; color:#7d5d1f; } .rate-hard:hover { border-color:#e2cfa3; }
    .rate-good { background:#e4efe8; color:#3f6150; } .rate-good:hover { border-color:#b5cdbd; }

    .progress { height:8px; border-radius:99px; background: var(--cream); overflow:hidden; }

    .paper .cols > .pq { min-width:0; }
    .paper .pq { break-inside: avoid; page-break-inside: avoid; padding: 1.5mm 0 3mm; margin-bottom:2mm; border-bottom: .5pt solid #e3e3e3; }
    .paper .pq.wide { grid-column: 1 / -1; }
    .paper .qh { font-size:8.5pt; font-weight:700; color:#444; margin-bottom:1mm; display:flex; justify-content:space-between; gap:2mm; }
    .paper .qh .ans { background:#fde8e6; color:#a03f35; padding:0 2mm; border-radius:1mm; white-space:nowrap; }
    .paper .pq img { display:block; height:auto; }
.paper .qtext { font-size:10.5pt; line-height:1.65; }
    .paper .qstem { margin-bottom:1mm; }
    .paper .qopts { display:grid; grid-template-columns: 1fr; gap:.5mm 4mm; }
    .paper .qopts.short { grid-template-columns: 1fr 1fr; }
    .paper .qfig { display:block; margin:1.5mm 0; height:auto; max-width:100%; }
    .paper .ai-mark { display:inline-block; margin-top:1mm; font-size:8pt; font-weight:700; color:#8a5a00; background:#fff3cd; border:.5pt solid #f0d58a; border-radius:1.5mm; padding:.5mm 2mm; cursor:pointer; }
.sq { font-size:1.02rem; line-height:1.75; }
    .sq .qstem { margin-bottom:.35rem; }
    .sq .qopts { display:grid; grid-template-columns:1fr; gap:.15rem 1.5rem; }
    .sq .qopts.short { grid-template-columns:1fr 1fr; }
    .sq .qfig { display:block; margin:.6rem 0; height:auto; border-radius:8px; }
    .qz-opt { display:flex; align-items:center; gap:.75rem; width:100%; text-align:left; padding:.8rem 1rem; border-radius:16px; border:2px solid var(--line); background:var(--surface); font-size:1rem; line-height:1.5; }
    .qz-opt b { width:2.2rem; height:2.2rem; border-radius:12px; background:var(--cream); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .qz-opt.on { border-color:var(--ink); background:#f6f2ee; } .qz-opt.on b { background:var(--ink); color:#fff; }
    .qz-dot { min-width:40px; height:40px; border-radius:12px; border:1px solid var(--line); background:var(--surface); font-weight:750; color:var(--muted); }
    .qz-dot.done { background:#efe7df; color:var(--ink); } .qz-dot.cur { outline:3px solid var(--rose); outline-offset:1px; }
    .qz-dot.ok { background:#e4efe8; color:#3f6150; border-color:#b5cdbd; } .qz-dot.ng { background:#fbeceb; color:#a03f35; border-color:#e3b4ae; }
    @media print { .paper .ai-mark { display:none !important; } }
    .paper .answer-space { border:.6pt dashed #bbb; border-radius:1.5mm; margin-top:1.5mm; color:#bbb; font-size:7.5pt; padding:1mm 2mm; }
    .paper .sol-row { display:flex; flex-wrap:wrap; gap:4mm; align-items:flex-start; }
    .paper .sol-row > .sol { flex:1 1 62mm; min-width:62mm; background:#fbf6ee; border:.5pt solid #efe1c8; border-radius:1.5mm; padding:2mm 3mm; font-size:8.8pt; line-height:1.55; }
    .paper .sol .steps .step { padding:.3mm 0; line-height:1.55; gap:1.5mm; }

    @media print {
      @page { size: A4; margin: 12mm; }
      body { background:#fff !important; padding:0 !important; }
      body > *:not(#print-area) { display:none !important; }
      #print-area { display:block !important; }
      .no-print { display:none !important; }

<body>

  <!-- 頂部 -->
  <header class="sticky top-0 z-50 border-b border-[#e9e1d8] bg-[#f7f3ee]/90 backdrop-blur-md">
    <div class="max-w-5xl mx-auto px-4 h-[64px] flex items-center justify-between gap-3">
      <button class="flex items-center gap-3 min-w-0 text-left" onclick="switchTab('home')">
        <div class="serif w-11 h-11 shrink-0 rounded-2xl bg-[#a9645a] text-white flex items-center justify-center text-xl font-bold shadow-sm">敦</div>
        <div class="min-w-0">
          <div class="font-bold text-[1.05rem] leading-tight truncate">段考複習・錯題庫</div>
          <div class="text-[.78rem] muted truncate">敦化國中 八年級</div>
        </div>
      </button>
      <div class="flex items-center gap-2">
        <div id="hdr-exams" class="flex items-center gap-2"></div>
        <button class="btn btn-ghost btn-icon" onclick="openSettings()" aria-label="設定與備份" data-icon="settings"></button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 pt-5 pb-8">
    <section id="tab-home"></section>
    <section id="tab-library" class="hidden"></section>
    <section id="tab-upload" class="hidden"></section>
    <section id="tab-plan" class="hidden"></section>
    <section id="tab-stats" class="hidden"></section>
    <section id="tab-print" class="hidden"></section>
    <section id="tab-focus" class="hidden"></section>
  </main>

  <nav class="tabbar no-print" id="tabbar"><div class="tabbar-inner" id="tabbar-inner"></div></nav>
  <div id="toasts"></div>
  <div id="print-area"></div>

  <!-- 通用詢問視窗 -->
  <div id="modal-ask" class="modal hidden" style="z-index:9200">
    <div class="modal-box max-w-[440px]!">
      <div id="ask-title" class="font-bold text-lg mb-2"></div>
      <div id="ask-msg" class="text-[.95rem] leading-relaxed text-[#5e5651] whitespace-pre-line"></div>
      <div id="ask-btns" class="flex flex-wrap justify-end gap-2 mt-5"></div>
    </div>
  </div>

  <!-- 編輯錯題 -->
  <div id="modal-edit" class="modal hidden" onclick="if(event.target===this) closeModal('modal-edit')">
    <div class="modal-box max-w-[680px]!">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-bold text-lg">編輯錯題</h3>
        <button class="btn btn-ghost btn-icon" onclick="closeModal('modal-edit')" data-icon="x" aria-label="關閉"></button>
      </div>
      <div id="edit-body" class="space-y-4"></div>
      <div class="flex flex-wrap justify-between gap-2 mt-6 pt-4 divider">
        <button class="btn btn-danger" onclick="deleteFromEdit()"><span data-icon="trash"></span>刪除此題</button>
        <div class="flex gap-2">
          <button class="btn btn-line" onclick="closeModal('modal-edit')">取消</button>
          <button class="btn btn-primary" onclick="saveEdit()">儲存修改</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 日期備忘 -->
  <div id="modal-note" class="modal hidden" onclick="if(event.target===this) closeModal('modal-note')">
    <div class="modal-box max-w-[460px]!">
      <div class="flex items-center justify-between mb-3">
        <div>
          <h3 class="font-bold text-lg">當日備忘</h3>
          <div id="note-date" class="text-sm font-semibold text-[#a9645a] num"></div>
        </div>
        <button class="btn btn-ghost btn-icon" onclick="closeModal('modal-note')" data-icon="x" aria-label="關閉"></button>
      </div>
      <textarea id="note-input" rows="4" class="textarea" placeholder="例如：寫理化歷屆第 1 回、複習歷史第 3 章"></textarea>
      <div class="flex justify-between mt-4">
        <button class="btn btn-danger" onclick="saveNote(true)">清空</button>
        <div class="flex gap-2">
          <button class="btn btn-line" onclick="closeModal('modal-note')">取消</button>
          <button class="btn btn-primary" onclick="saveNote(false)">儲存</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 設定 -->
  <div id="modal-settings" class="modal hidden" onclick="if(event.target===this) closeModal('modal-settings')">
    <div class="modal-box">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-bold text-lg">設定與資料備份</h3>
        <button class="btn btn-ghost btn-icon" onclick="closeModal('modal-settings')" data-icon="x" aria-label="關閉"></button>
      </div>
      <div id="settings-body" class="space-y-5"></div>
    </div>
  </div>

  <!-- 裁切工具 -->
  <div id="cropper" class="hidden">
    <div class="flex items-center justify-between gap-2 px-4 pt-[max(12px,env(safe-area-inset-top))] pb-3 text-white">
      <button class="btn btn-sm bg-white/10! text-white!" onclick="cropDone(false)">取消</button>
      <div class="text-center">
        <div class="font-bold">框選題目範圍</div>
        <div class="text-xs text-white/60">拖曳框線調整；在框外拖曳可重新框選</div>
      </div>
      <button class="btn btn-sm btn-primary" onclick="cropDone(true)"><span data-icon="check"></span>確定</button>
    </div>
    <div id="crop-stage">
      <div id="crop-wrap">
        <img id="crop-img" alt="">
        <div id="crop-rect">
          <div class="h nw" data-h="nw"></div><div class="h ne" data-h="ne"></div><div class="h sw" data-h="sw"></div><div class="h se" data-h="se"></div>
          <div class="h n" data-h="n"></div><div class="h s" data-h="s"></div><div class="h w" data-h="w"></div><div class="h e" data-h="e"></div>
        </div>
      </div>
    </div>
    <div class="flex justify-center gap-2 px-4 pt-3 pb-[max(14px,env(safe-area-inset-bottom))]">
      <button class="btn btn-sm bg-white/10! text-white!" onclick="cropSelectAll()"><span data-icon="maximize"></span>整張</button>
    </div>
  </div>

  <!-- 手動擦除筆跡 -->
  <div id="eraser" class="hidden">
    <div class="flex items-center justify-between gap-2 px-4 pt-[max(12px,env(safe-area-inset-top))] pb-3 text-white">
      <button class="btn btn-sm bg-white/10! text-white!" onclick="eraserDone(false)">取消</button>
      <div class="text-center">
        <div class="font-bold">擦除筆跡</div>
        <div class="text-xs text-white/60">用手指塗過要擦掉的手寫答案；只會改練習用版本</div>
      </div>
      <button class="btn btn-sm btn-primary" onclick="eraserDone(true)"><span data-icon="check"></span>完成</button>
    </div>
    <div id="er-stage"><canvas id="er-canvas"></canvas></div>
    <div class="flex flex-wrap justify-center items-center gap-2 px-4 pt-3 pb-[max(14px,env(safe-area-inset-bottom))] text-white">
      <span class="text-sm text-white/70">筆刷</span>
      <button class="pill er-size" data-size="10" onclick="setBrush(10)">小</button>
      <button class="pill er-size" data-size="22" onclick="setBrush(22)">中</button>
      <button class="pill er-size" data-size="40" onclick="setBrush(40)">大</button>
      <span class="w-3"></span>
      <button class="btn btn-sm bg-white/10! text-white!" onclick="eraserUndo()"><span data-icon="undo"></span>復原</button>
      <button class="btn btn-sm bg-white/10! text-white!" onclick="eraserReset()">全部還原</button>
    </div>
  </div>

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const pad = n => String(n).padStart(2, '0');
function esc(s) { return s == null ? '' : String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
function uid(p = 'id') { return p + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7); }
function todayKey(d = new Date()) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function parseKey(k) { const [y, m, d] = String(k).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); }
function addDays(k, n) { const d = parseKey(k); d.setDate(d.getDate() + n); return todayKey(d); }
function diffDays(a, b) { return Math.round((parseKey(b) - parseKey(a)) / 86400000); }
function fmtMD(k) { const d = parseKey(k); return `${d.getMonth() + 1}/${d.getDate()}`; }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function icon(n, cls = 'w-5 h-5') { return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ''}</svg>`; }
function hydrateIcons(root = document) { $$('[data-icon]', root).forEach(el => { if (!el.dataset.iconDone) { el.insertAdjacentHTML('afterbegin', icon(el.dataset.icon)); el.dataset.iconDone = 1; } }); }
function subjChip(s) { const x = SUBJECTS[s] || SUBJECTS.math; return `<span class="chip ${x.cls}">${x.name}</span>`; }

  if (!el || !window.renderMathInElement) return;
  try { renderMathInElement(el, { delimiters: [{ left: '$$', right: '$$', display: true }, { left: '$', right: '$', display: false }], throwOnError: false }); } catch (e) {}
}
function formatSteps(sol) {
  const lines = String(sol || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  if (!lines.length) return '<div class="muted">尚無解析</div>';
  return '<div class="steps">' + lines.map(l => l.startsWith('★')
    ? `<div class="step star">${esc(l)}</div>`
    : `<div class="step"><span class="dot">▸</span><span>${esc(l)}</span></div>`).join('') + '</div>';
}

// 題目文字排版：題幹＋選項（短選項排兩欄）
function formatQuestionText(t) {
  const OPT = /[（(]\s*([A-E])\s*[)）]/;
  const raw = String(t || '').replace(/\r/g, '');
  const lines = [];
  for (const ln of raw.split('\n')) {
    // 同一行有好幾個選項時拆開
    const parts = ln.split(/(?=[（(]\s*[A-E]\s*[)）])/).map(x => x.trim()).filter(Boolean);
    if (parts.length > 1 && parts.slice(1).every(p => OPT.test(p.slice(0, 4)))) lines.push(...parts); else if (ln.trim()) lines.push(ln.trim());
  }
  const stem = [], opts = [];
  for (const l of lines) { const m = l.match(/^[（(]\s*([A-E])\s*[)）]\s*(.*)$/); if (m && (opts.length || stem.length)) opts.push([m[1], m[2]]); else if (opts.length) opts[opts.length - 1][1] += ' ' + l; else stem.push(l); }
  const short = opts.length && opts.every(o => o[1].replace(/\$[^$]*\$/g, 'xx').length <= 9);
  return `<div class="qstem">${stem.map(esc).join('<br>')}</div>` + (opts.length ? `<div class="qopts ${short ? 'short' : ''}">${opts.map(o => `<div><b>(${o[0]})</b> ${esc(o[1])}</div>`).join('')}</div>` : '');
}
// 螢幕上的題目呈現：文字＋圖表 或 截圖（v: 'orig' 原圖／'clean' 擦掉答案版）
const canText = e => !!e.content && (!e.hasImage || e.figChecked);
function screenQuestion(e, mode, v = 'orig') {
  if (mode === 'text' && canText(e)) return `<div class="sq">${formatQuestionText(e.content)}${e.hasImage ? [0, 1, 2, 3].map(i => `<img class="qfig" data-fig="${e.id}" data-i="${i}" alt="">`).join('') : ''}</div>`;
  if (e.hasImage) return `<div class="qimg"><img data-img="${e.id}" data-v="${v}" alt="原題截圖" loading="lazy"></div>`;
  return `<div class="sq">${formatQuestionText(e.content)}</div>`;
}
function toast(msg, type = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + (type === 'success' ? 'ok' : type === 'error' ? 'err' : '');
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateY(6px)'; setTimeout(() => el.remove(), 300); }, 2800);
}

// 通用詢問：buttons = [{label, value, style}]
function ask(title, msg, buttons) {
  return new Promise(resolve => {
    $('#ask-title').textContent = title;
    $('#ask-msg').textContent = msg || '';
    const box = $('#ask-btns'); box.innerHTML = '';
    buttons.forEach(b => {
      const btn = document.createElement('button');
      btn.className = 'btn ' + (b.style || 'btn-line');
      btn.textContent = b.label;
      btn.onclick = () => { closeModal('modal-ask'); resolve(b.value); };
      box.appendChild(btn);
    });
    openModal('modal-ask');
  });
}

const DB = {
  _db: null,
  open() {
    if (this._db) return Promise.resolve(this._db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('dunhua-exam', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => { this._db = r.result; res(r.result); };
      r.onerror = () => rej(r.error);
    });
  },
  async get(k) {
    const db = await this.open();
    return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
  },
  async set(k, v) {
    const db = await this.open();
    return new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); });
  },
  async del(k) {
    const db = await this.open();
    return new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').delete(k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); });
  }
};
const imgCache = new Map();
async function getImg(id) {
  if (imgCache.has(id)) return imgCache.get(id);
  const v = await DB.get('img:' + id).catch(() => null);
  if (v) imgCache.set(id, v);
  return v || null;
}
async function setImg(id, v) { imgCache.set(id, v); await DB.set('img:' + id, v); }
async function delImg(id) { imgCache.delete(id); await DB.del('img:' + id).catch(() => {}); }
// 統一字級：依截圖中的字高縮放。螢幕上字高約 19px；列印時與原考卷差不多（字高約 2.6mm）
const SCREEN_CH = 19, PRINT_CH_MM = 2.6, COL_MM = 89, FULL_MM = 186;
function charHeightOf(v) { return v.chSrc === 'photo' ? v.ch : (v.chGroup || v.ch || 0); }
function sizeImage(el, v) {
  const ch = charHeightOf(v), w = v.w || el.naturalWidth || 0;
  if (el.dataset.fit === 'print') {
    let mm = ch > 3 && w ? w * PRINT_CH_MM / ch : 0;
    const pq = el.closest('.pq');
    if (!mm) mm = COL_MM;
    if (pq && pq.classList.contains('two-col')) {
      if (mm > COL_MM * 1.2) { pq.classList.add('wide'); mm = Math.min(mm, FULL_MM); }
      else mm = Math.min(mm, COL_MM);
    } else mm = Math.min(mm, el.dataset.max ? +el.dataset.max : FULL_MM);
    el.style.width = mm.toFixed(1) + 'mm'; el.style.maxWidth = 'none';
  } else if (ch > 3 && w) {
    el.style.width = Math.round(w * SCREEN_CH / ch) + 'px'; el.style.maxWidth = '100%';
  }
}
// 將容器內 <img data-img="id" data-v="orig|clean"> 填入圖片
async function hydrateImages(root) {
  for (const el of $$('img[data-fig]', root)) {
    if (el.dataset.loaded) continue;
    const v = await getImg(el.dataset.fig), f = v && v.figs && v.figs[+el.dataset.i];
    if (!f) { el.remove(); continue; }
    el.src = f.url; el.dataset.loaded = 1;
    const ch = charHeightOf(v);
    if (el.closest('.paper')) {
      let mm = ch > 3 ? f.w * PRINT_CH_MM / ch : 60;
      mm = Math.min(mm, el.closest('.two-col') ? COL_MM : 118);
      el.style.width = mm.toFixed(1) + 'mm';
    } else { el.style.width = (ch > 3 ? Math.round(f.w * 17 / ch) : Math.min(f.w, 480)) + 'px'; el.style.maxWidth = '100%'; }
  }
  for (const el of $$('img[data-img]', root)) {
    if (el.dataset.loaded) continue;
    const v = await getImg(el.dataset.img);
    if (v) { el.src = (el.dataset.v === 'clean' ? (v.clean || v.orig) : v.orig); el.dataset.loaded = 1; sizeImage(el, v); }
    else { el.closest('.qimg')?.classList.add('hidden'); }
  }
}

const S = { errors: [], exams: [], scores: [], notes: {}, checklistItems: [], checklistState: {}, meta: {} };
async function persist(...keys) {
  try { for (const k of keys) await DB.set(k, S[k]); }
  catch (e) { toast('儲存失敗：' + e.message, 'error'); }
}
function oldChapterToNew(subject, ch) {
  if (!ch) return '';
  if (subject === 'math' && /^\d-\d$/.test(ch)) return 'm-' + ch.replace('-', '');
  if (subject === 'physics' && /^\d-\d$/.test(ch)) return 'p-' + ch.replace('-', '');
  if (subject === 'english') return ({ 'u-3': 'en-3', 'u-4': 'en-4', 'rev-2': 'en-rev' })[ch] || ch;
  return ch;
}
function normErr(e) {
  return {
    id: e.id || uid('e'),
    subject: SUBJECTS[e.subject] ? e.subject : 'math',
    chapter: e.chapter || '', chapterName: e.chapterName || '',
    questionType: e.questionType || '', content: e.content || '',
    studentAnswer: e.studentAnswer || '', correctAnswer: e.correctAnswer || '',
    tag: e.tag || '', solution: e.solution || '', svgDiagram: e.svgDiagram || '',
    hasImage: !!e.hasImage, source: e.source || '',
    createdAt: e.createdAt || todayKey(),
    review: Object.assign({ due: todayKey(), streak: 0, count: 0, last: '' }, e.review || {}),
    mastered: !!e.mastered,
    ai: e.ai || '', aiErr: e.aiErr || '', aiKeep: e.aiKeep || [], unsure: Array.isArray(e.unsure) ? e.unsure : [],
    figChecked: !!e.figChecked, textChecked: !!e.textChecked
  };
}
function lsJson(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }

async function loadState() {
  const errors = await DB.get('errors');
  if (errors === undefined) {
    // 第一次開啟新版：從舊版（LocalStorage）搬移
    const old = lsJson('EXAM_ERRORS_V3', null);
    S.errors = Array.isArray(old)
      ? old.filter(e => !String(e.id).startsWith('sample-')).map(e => normErr({ ...e, chapter: oldChapterToNew(e.subject, e.chapter) }))
      : [];
    const items = lsJson('EXAM_CHECKLIST_ITEMS_V1', null);
    S.checklistItems = Array.isArray(items) && items.length ? items : JSON.parse(JSON.stringify(DEFAULT_CHECKLIST));
    S.checklistState = lsJson('EXAM_CHECKLIST_STATE', {});
    S.notes = lsJson('EXAM_CALENDAR_NOTES', {});
    S.exams = JSON.parse(JSON.stringify(DEFAULT_EXAMS));
    S.scores = [];
    S.meta = { createdAt: todayKey(), migratedFromV3: Array.isArray(old) };
    await persist('errors', 'checklistItems', 'checklistState', 'notes', 'exams', 'scores', 'meta');
  } else {
    S.errors = errors.map(normErr);
    S.exams = (await DB.get('exams')) || JSON.parse(JSON.stringify(DEFAULT_EXAMS));
    S.scores = (await DB.get('scores')) || [];
    S.notes = (await DB.get('notes')) || {};
    S.checklistItems = (await DB.get('checklistItems')) || JSON.parse(JSON.stringify(DEFAULT_CHECKLIST));
    S.checklistState = (await DB.get('checklistState')) || {};
    S.meta = (await DB.get('meta')) || {};
  }
}

function groupSubject(groupKey) { return (GROUPS.find(g => g.key === groupKey) || {}).subject; }
function chaptersOf(sub) { return S.checklistItems.filter(i => groupSubject(i.subject) === sub); }
function chapterName(e) { const c = S.checklistItems.find(i => i.id === e.chapter); return c ? c.name : (e.chapterName || '未分類單元'); }
function isDue(e) { return !e.mastered && !(e.ai === 'pending' || e.ai === 'running') && (!e.review.due || e.review.due <= todayKey()); }
function upcomingExams() {
  const t = todayKey();
  return S.exams.filter(x => x.date && addDays(x.date, (x.days || 1) - 1) >= t).sort((a, b) => a.date.localeCompare(b.date));
}

const QZ = { stage: '', subject: 'all', scope: 'learning', count: 10, ids: [], idx: 0, ans: {}, self: {}, result: null };
const isChoice = e => /^\s*[(（]?[A-E][)）]?\s*$/i.test(e.correctAnswer || '');
const normAns = a => String(a || '').toUpperCase().replace(/[^A-E]/g, '');
function quizPool() {
  return S.errors.filter(e => !aiBusy(e) && (QZ.subject === 'all' || e.subject === QZ.subject) && (QZ.scope === 'all' ? true : QZ.scope === 'due' ? isDue(e) : !e.mastered));
}
function quizSetup() { QZ.stage = 'setup'; renderHome(); }
function quizExit() { Object.assign(QZ, { stage: '', ids: [], ans: {}, self: {}, result: null }); renderNav(); renderHome(); window.scrollTo({ top: 0 }); }
function quizStart() {
  const pool = shuffle(quizPool());
  if (!pool.length) return toast('這個範圍沒有題目');
  QZ.ids = pool.slice(0, QZ.count === 'all' ? pool.length : QZ.count).map(e => e.id);
  Object.assign(QZ, { stage: 'doing', idx: 0, ans: {}, self: {}, result: null });
  renderHome(); window.scrollTo({ top: 0 });
}
function quizGo(i) { QZ.idx = Math.max(0, Math.min(QZ.ids.length - 1, i)); renderHome(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
function quizAnswer(v, quiet) { QZ.ans[QZ.ids[QZ.idx]] = v; if (!quiet) renderHome(); }
async function quizSubmit() {
  const left = QZ.ids.filter(id => !QZ.ans[id]).length;
  if (left && !(await confirmBox(`還有 ${left} 題沒有作答，確定要交卷嗎？`, '交卷'))) return;
  QZ.stage = 'result'; QZ.applied = {};
  // 選擇題自動批改並更新複習排程
  for (const id of QZ.ids) { const e = S.errors.find(x => x.id === id); if (e && isChoice(e)) applyQuizResult(e, normAns(QZ.ans[id]) === normAns(e.correctAnswer)); }
  persist('errors', 'meta');
  renderNav(); renderHome(); window.scrollTo({ top: 0 });
}
function applyQuizResult(e, ok) {
  if (QZ.applied[e.id] !== undefined) return;
  QZ.applied[e.id] = ok;
  const t = todayKey();
  e.review.count = (e.review.count || 0) + 1; e.review.last = t;
  e.review.streak = ok ? (e.review.streak || 0) + 1 : 0;
  e.review.due = addDays(t, ok ? RATE_DAYS.good : RATE_DAYS.again);
  if (e.review.streak >= 3) e.mastered = true;
  S.meta.reviewDays = S.meta.reviewDays || {}; S.meta.reviewDays[t] = (S.meta.reviewDays[t] || 0) + 1;
}
function quizSelf(id, ok) {
  const e = S.errors.find(x => x.id === id); if (!e) return;
  QZ.self[id] = ok; applyQuizResult(e, ok); persist('errors', 'meta'); renderHome();
}
function quizOk(e) { return isChoice(e) ? normAns(QZ.ans[e.id]) === normAns(e.correctAnswer) : QZ.self[e.id]; }
function renderQuiz() {
  const el = $('#tab-home');

    const letters = [...new Set(opts.length >= 2 ? opts : ['A', 'B', 'C', 'D'])];
    el.innerHTML = `

          <button class="btn btn-ghost btn-sm" onclick="confirmBox('要離開這份錯題卷嗎？作答內容不會保留。','離開').then(ok=>ok&&quizExit())">${icon('left', 'w-4 h-4')}離開</button>
          <span class="text-sm font-semibold muted num">已作答 ${done} / ${list.length}</span>
          <button class="btn btn-sage btn-sm" onclick="quizSubmit()">${icon('check', 'w-4 h-4')}交卷</button>
        </div>
        <div class="flex flex-wrap gap-1.5 mb-3">${list.map((x, i) => `<button class="qz-dot num ${QZ.ans[x.id] ? 'done' : ''} ${i === QZ.idx ? 'cur' : ''}" onclick="quizGo(${i})">${i + 1}</button>`).join('')}</div>
        <div class="card p-5 sm:p-6">
          <div class="flex flex-wrap items-center gap-2 mb-4"><span class="serif text-xl font-bold mr-1">第 ${QZ.idx + 1} 題</span>${subjChip(e.subject)}<span class="chip chip-muted">${esc(chapterName(e))}</span></div>
          ${screenQuestion(e, 'text', 'clean')}
          <div class="mt-5">
            ${isChoice(e) ? `<div class="grid ${letters.length > 2 ? 'sm:grid-cols-2' : ''} gap-2">${letters.map(L => `<button class="qz-opt ${normAns(a) === L ? 'on' : ''}" onclick="quizAnswer('${L}')"><b>${L}</b><span>選 ${L}</span></button>`).join('')}</div>`
              : `<label class="label">你的答案</label>
                 <div class="flex flex-wrap gap-2"><input class="input flex-1 min-w-[12rem]" value="${esc(a === '（已在紙上作答）' ? '' : a)}" placeholder="在這裡輸入答案" oninput="quizAnswer(this.value,true);renderQuizDots()">
                 <button class="btn ${a === '（已在紙上作答）' ? 'btn-dark' : 'btn-line'}" onclick="quizAnswer('（已在紙上作答）')">我在紙上算好了</button></div>`}
          </div>

}

async function rate(r) {
  const e = S.errors.find(x => x.id === RV.queue[RV.idx]);
  if (e) {
    const t = todayKey();
    e.review.count = (e.review.count || 0) + 1;
    e.review.last = t;
    e.review.streak = r === 'good' ? (e.review.streak || 0) + 1 : 0;
    e.review.due = addDays(t, RATE_DAYS[r]);
    if (e.review.streak >= 3) { e.mastered = true; toast('🏅 這題已精熟！', 'success'); }
    S.meta.reviewDays = S.meta.reviewDays || {};
    S.meta.reviewDays[t] = (S.meta.reviewDays[t] || 0) + 1;
    // 只保留 120 天紀錄
    Object.keys(S.meta.reviewDays).forEach(d => { if (diffDays(d, t) > 120) delete S.meta.reviewDays[d]; });
    RV.tally[r]++;
    persist('errors', 'meta');
  }
  RV.idx++; RV.flipped = false;
  renderNav(); renderReview();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

});

【批改記號的意義】
- 學生用黑色或藍色筆作答：選擇題把選項字母寫在題號前的括號附近；非選題寫在作答區。
- 老師用紅筆批改：學生答錯時，老師會在旁邊用紅筆寫上「正確答案」（例如紅色的 A）、或畫圈、打叉。
- 一條很長的紅色斜線或大勾，是批改記號，通常代表那一區的題目答對。

// opts.wait：遇到每分鐘上限時，是否自動等待後重試（互動操作用）
async function gemini(parts, json = true, opts = {}) {
  const key = localStorage.getItem('GEMINI_API_KEY');
  if (!key) throw new Error('請先設定 Gemini API Key');
  const custom = (localStorage.getItem('GEMINI_MODEL') || '').trim();
  const set = MODEL_SETS[opts.mode || aiMode()];
  const models = custom ? [custom] : [...new Set([set.includes(workingModel) ? workingModel : null, ...set].filter(Boolean))];
  let lastMsg = '';
  for (const m of models) {
    for (let attempt = 0; attempt < 3; attempt++) {
      const gc = json ? { responseMimeType: 'application/json', temperature: 0.2 } : { temperature: 0.4 };
      if (!noThinkCfg.has(m)) gc.thinkingConfig = { thinkingLevel: 'low' };
      let res;
      try {
        res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`, {
          method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
          body: JSON.stringify({ contents: [{ parts }], generationConfig: gc })
        });
      } catch (e) { lastMsg = '網路連線失敗，請確認網路後再重試'; await sleep(2000 * (attempt + 1)); continue; }
      if (res.ok) {
        const data = await res.json();
        workingModel = m;
        const text = (data.candidates?.[0]?.content?.parts || []).filter(p => !p.thought).map(p => p.text || '').join('');
        if (!text) throw new Error('AI 沒有回應內容（可能被安全機制擋下）');
        return text;
      }
      const err = await res.json().catch(() => ({}));
      const msg = err.error?.message || `HTTP ${res.status}`;
      if (res.status === 400 && /api key/i.test(msg)) throw new Error('API Key 無效，請到設定重新輸入');
      if (res.status === 403) throw new Error('API Key 沒有使用權限，請到 Google AI Studio 確認');
      if (res.status === 400 && /thinking/i.test(msg) && !noThinkCfg.has(m)) { noThinkCfg.add(m); attempt--; continue; }
      if (res.status === 429) {
        const q = parseQuota(err);
        if (q.perDay) throw new QuotaError('day', nextQuotaReset() - Date.now(), `今天的免費額度用完了，台灣時間 ${fmtClock(nextQuotaReset())} 後恢復`);
        const wait = Math.max(q.retryMs, 15000);
        if (opts.wait && attempt < 2 && wait <= 65000) { await sleep(wait); continue; }
        throw new QuotaError('minute', wait, `每分鐘的次數已滿，約 ${Math.ceil(wait / 1000)} 秒後可以再試`);
      }
      if ([500, 503].includes(res.status) && attempt < 2) { await sleep(4000 * (attempt + 1)); lastMsg = 'Google AI 伺服器忙碌中，請稍後再重試'; continue; }
      if ([500, 503].includes(res.status)) { lastMsg = 'Google AI 伺服器忙碌中，請稍後再重試'; break; }
      // 模型不存在或已停用：換下一個模型
      lastMsg = msg;
      if (res.status === 404 || /not found|no longer available|not supported|deprecated/i.test(msg)) break;
      throw new Error('AI 回應錯誤：' + msg.slice(0, 100));
    }
    if (workingModel === m) workingModel = null;
  }
  throw new Error(/忙碌|網路/.test(lastMsg) ? lastMsg : '目前無法使用 AI 模型，請到設定按「測試連線」檢查（' + (lastMsg || '未知錯誤').slice(0, 80) + '）');
}
function sanitizeSvg(str) {
  if (!str || !/<svg[\s>]/i.test(str)) return '';
  try {
    const doc = new DOMParser().parseFromString(str, 'image/svg+xml');
    const svg = doc.documentElement;
    if (svg.nodeName.toLowerCase() !== 'svg') return '';
    svg.querySelectorAll('script,foreignObject,iframe,image').forEach(n => n.remove());
    svg.querySelectorAll('*').forEach(n => [...n.attributes].forEach(a => { if (/^on/i.test(a.name) || /javascript:/i.test(a.value)) n.removeAttribute(a.name); }));
    svg.removeAttribute('width'); svg.removeAttribute('height');
    return new XMLSerializer().serializeToString(svg);
  } catch (e) { return ''; }
}
async function aiDiagram(id) {
  const e = S.errors.find(x => x.id === id); if (!e) return;
  const btn = $('#ai-svg-' + id); if (btn) { btn.disabled = true; btn.textContent = 'AI 繪製中…'; }
  try {
    const parts = [{ text: `你是台灣國中老師。請針對這一題，畫一張「幫助學生看懂解析」的示意圖（不是重畫原題）。
題目：${e.content}
正確答案：${e.correctAnswer}
解析：${e.solution}
要求：輸出一個 SVG，viewBox 寬約 400、高約 220；溫暖手繪教科書風格：深褐外框 stroke="#4a4441"、填色用莫蘭迪色 #c5dcb6、#95c6de、#e39286、#f4e4ba；用紅色箭頭（#c0392b）與中文字標出關鍵；字體大小至少 12；不要用外部圖片或字型。
只回傳 JSON：{"svg":"<svg ...>...</svg>"}` }];
    if (e.hasImage) { const im = await getImg(id); if (im) parts.push({ inline_data: { mime_type: 'image/jpeg', data: im.orig.split(',')[1] } }); }
    const j = parseJsonLoose(await gemini(parts, true, { wait: true }));
    const svg = sanitizeSvg(j.svg || '');
    if (!svg) throw new Error('AI 沒有產生有效的圖');
    e.svgDiagram = svg; await persist('errors');
    toast('已產生圖解', 'success');
  } catch (err) { toast('產生失敗：' + err.message, 'error'); }
  renderLibList();
}

async function updExam(id, k, v) { const x = S.exams.find(e => e.id === id); if (!x) return; x[k] = v; await persist('exams'); renderHeader(); renderCalendar(); }
async function addExam() { S.exams.push({ id: uid('ex'), name: '新的考試', short: '', date: addDays(todayKey(), 30), days: 1 }); await persist('exams'); renderPlan(); renderHeader(); }
async function delExam(id) { if (!(await confirmBox('確定刪除這個考試？'))) return; S.exams = S.exams.filter(e => e.id !== id); await persist('exams'); renderPlan(); renderHeader(); }
function examOn(key) { return S.exams.find(x => x.date && key >= x.date && key <= addDays(x.date, (x.days || 1) - 1)); }
function renderCalendar() {
  const grid = $('#cal-grid'); if (!grid) return;
  const y = calDate.getFullYear(), m = calDate.getMonth();
  $('#cal-title').textContent = `${y} 年 ${m + 1} 月`;
  const first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate(), t = todayKey();
  let html = '';
  for (let i = 0; i < first; i++) html += '<div class="cal-empty"></div>';
  for (let d = 1; d <= days; d++) {
    const k = `${y}-${pad(m + 1)}-${pad(d)}`, ex = examOn(k), note = S.notes[k];
    html += `<button class="cal-cell ${k === t ? 'today' : ''}" onclick="openNote('${k}')">
      <span class="text-sm font-bold num ${k === t ? 'text-[#8a4c43]' : ''}">${d}</span>
      ${ex ? `<span class="text-[.68rem] font-bold px-1.5 py-0.5 rounded-md bg-[#a9645a] text-white truncate">★ ${esc(ex.short || ex.name)}</span>` : ''}
      ${note ? `<span class="text-[.7rem] leading-tight text-[#73574a] bg-[#f4ede5] px-1.5 py-0.5 rounded-md line-clamp-2">${esc(note)}</span>` : ''}
    </button>`;
  }
  grid.innerHTML = html;
}
function openNote(k) { noteKey = k; $('#note-date').textContent = k.replace(/-/g, '/'); $('#note-input').value = S.notes[k] || ''; openModal('modal-note'); setTimeout(() => $('#note-input').focus(), 50); }
async function saveNote(clear) {
  const v = clear ? '' : $('#note-input').value.trim();
  if (v) S.notes[noteKey] = v; else delete S.notes[noteKey];
  await persist('notes'); closeModal('modal-note'); renderCalendar(); toast(v ? '已儲存備忘' : '已清空備忘', 'success');
}
function renderChecklist() {
  const box = $('#ck-box'); if (!box) return;
  let total = 0, checked = 0;
  box.innerHTML = GROUPS.map(g => {
    const items = S.checklistItems.filter(i => i.subject === g.key);
    let gt = items.length * DIMS.length, gc = 0;
    const rows = items.map(it => {
      const cells = DIMS.map(([d]) => { const k = `${it.id}_${d}`, on = !!S.checklistState[k]; if (on) gc++; return `<td class="text-center py-1"><input type="checkbox" class="cb" ${on ? 'checked' : ''} onchange="toggleCk('${k}',this.checked)" aria-label="${d}"></td>`; }).join('');
      return `<tr class="border-t border-[#f1ebe4]">
        <td class="py-1 pr-2"><div class="flex items-center gap-1">
          <input class="w-full bg-transparent hover:bg-white focus:bg-white px-2 py-1.5 rounded-lg border border-transparent hover:border-[#e9e1d8] focus:border-[#a9645a] outline-none text-[.95rem]" value="${esc(it.name)}" onchange="renameCk('${it.id}',this.value)" onkeydown="if(event.key==='Enter')this.blur()">
          <button class="btn btn-ghost btn-icon shrink-0 min-h-[34px]! min-w-[34px]! opacity-60 hover:opacity-100" aria-label="刪除單元" onclick="delCk('${it.id}')">${icon('x', 'w-4 h-4')}</button></div></td>${cells}</tr>`;
    }).join('');
    total += gt; checked += gc;
    const pct = gt ? Math.round(gc / gt * 100) : 0;
    return `<div class="rounded-2xl border border-[#e9e1d8] overflow-hidden">
      <div class="flex flex-wrap items-center justify-between gap-2 px-4 py-2.5 bg-[#faf6f1]">
        <span class="font-bold">${g.label}</span>
        <div class="flex items-center gap-2"><button class="btn btn-sm btn-line min-h-[32px]!" onclick="addCk('${g.key}')">${icon('plus', 'w-4 h-4')}新增單元</button>
          <span class="chip chip-line num">本科 ${pct}%</span></div>
      </div>
      <div class="overflow-x-auto"><table class="w-full min-w-[520px]">
        <thead><tr class="text-[.78rem] muted"><th class="text-left font-semibold px-3 py-1.5">單元</th>${DIMS.map(([, l]) => `<th class="w-[62px] font-semibold">${l}</th>`).join('')}</tr></thead>
        <tbody>${rows || `<tr><td colspan="6" class="px-3 py-3 text-sm muted">尚無單元</td></tr>`}</tbody></table></div></div>`;
  }).join('');
  const pct = total ? Math.round(checked / total * 100) : 0;
  $('#ck-total').textContent = pct + '%'; $('#ck-bar').style.width = pct + '%';
}

      <div class="relative w-64 h-64 mx-auto mt-6">

          <circle id="tm-ring" cx="112" cy="112" r="96" stroke="#a9645a" stroke-width="12" stroke-linecap="round" fill="none" stroke-dasharray="603.19" stroke-dashoffset="0"/></svg>
        <div class="absolute inset-0 flex flex-col items-center justify-center">

      </div>
      <div class="flex justify-center gap-3 mt-6">
        <button id="tm-toggle" class="btn btn-primary btn-lg min-w-[150px]" onclick="toggleTimer()"></button>

function setTimer(min, custom) {
  if (!min || min < 1 || min > 180) return toast('請輸入 1～180 分鐘', 'error');
  stopTicking(); TM.mode = custom ? 'c' : min; TM.total = TM.left = Math.round(min * 60); TM.running = false; renderFocus();
}
async function keepAwake(on) {
  try {
    if (on && 'wakeLock' in navigator) TM.wake = await navigator.wakeLock.request('screen');
    else if (!on && TM.wake) { await TM.wake.release(); TM.wake = null; }
  } catch (e) {}
}
function stopTicking() { clearInterval(TM.iv); TM.iv = null; keepAwake(false); }
function toggleTimer() {
  if (TM.running) { TM.left = Math.max(0, Math.round((TM.endAt - Date.now()) / 1000)); TM.running = false; stopTicking(); }
  else { if (TM.left <= 0) TM.left = TM.total; TM.endAt = Date.now() + TM.left * 1000; TM.running = true; TM.iv = setInterval(tick, 250); keepAwake(true); }
  drawTimer();
}
function resetTimer() { stopTicking(); TM.running = false; TM.left = TM.total; drawTimer(); }
function tick() {
  TM.left = Math.max(0, Math.round((TM.endAt - Date.now()) / 1000));
  if (TM.left <= 0) { TM.running = false; stopTicking(); chime(); toast('⏰ 時間到！休息一下', 'success'); }
  drawTimer();
}
function drawTimer() {
  const t = $('#tm-time'); if (!t) return;
  t.textContent = `${pad(Math.floor(TM.left / 60))}:${pad(TM.left % 60)}`;
  $('#tm-ring').style.strokeDashoffset = 603.19 * (1 - (TM.total - TM.left) / (TM.total || 1));
  $('#tm-status').textContent = TM.running ? '專注中…' : TM.left === 0 ? '時間到！' : TM.left === TM.total ? '準備開始' : '已暫停';
  $('#tm-toggle').innerHTML = TM.running ? icon('pause') + '暫停' : icon('play') + (TM.left < TM.total && TM.left > 0 ? '繼續' : '開始');
}
function chime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, .35, .7].forEach(d => {
      const o = ctx.createOscillator(), g = ctx.createGain(); o.connect(g); g.connect(ctx.destination);
      o.type = 'sine'; o.frequency.setValueAtTime(660, ctx.currentTime + d); o.frequency.exponentialRampToValueAtTime(990, ctx.currentTime + d + .25);
      g.gain.setValueAtTime(.3, ctx.currentTime + d); g.gain.exponentialRampToValueAtTime(.01, ctx.currentTime + d + .6);
      o.start(ctx.currentTime + d); o.stop(ctx.currentTime + d + .6);
    });
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && TM.running) { tick(); keepAwake(true); } });

  for (const e of S.errors) if (e.hasImage) { const v = await getImg(e.id); if (v) images[e.id] = v; }
  const data = { app: 'dunhua-exam', version: '4.0', exportedAt: new Date().toISOString(), errors: S.errors, images, exams: S.exams, scores: S.scores, notes: S.notes, checklistItems: S.checklistItems, checklistState: S.checklistState, reviewDays: S.meta.reviewDays || {} };
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `錯題庫備份_${todayKey()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  S.meta.lastBackupAt = todayKey(); await persist('meta');
  if (currentTab === 'home') renderHome();
}
async function importBackup(ev) {
  const f = ev.target.files[0]; ev.target.value = '';
  if (!f) return;
  let data;
  try { data = JSON.parse(await f.text()); } catch (e) { return toast('無法讀取這個檔案，請確認是錯題庫備份檔', 'error'); }
  if (!Array.isArray(data.errors)) return toast('檔案格式不符', 'error');
  const v4 = String(data.version || '').startsWith('4');
  const incoming = data.errors.map(e => normErr(v4 ? e : { ...e, chapter: oldChapterToNew(e.subject, e.chapter) }));
  const mode = await ask('匯入備份', `檔案中有 ${incoming.length} 道錯題${data.scores?.length ? `、${data.scores.length} 筆成績` : ''}。\n\n「合併」會保留目前的資料，只加入新的內容（建議）。\n「全部取代」會清掉目前的資料，改成檔案裡的內容。`,
    [{ label: '取消', value: null }, { label: '全部取代', value: 'replace', style: 'btn-danger' }, { label: '合併', value: 'merge', style: 'btn-primary' }]);
  if (!mode) return;
  closeModal('modal-settings');
  try {
    const images = data.images || {};
    if (mode === 'replace') {
      for (const e of S.errors) await delImg(e.id);
      S.errors = []; S.scores = []; S.notes = {}; S.checklistState = {};
      if (data.checklistItems?.length) S.checklistItems = [];
      if (data.exams?.length) S.exams = [];
    }
    const have = new Set(S.errors.map(e => e.id)); let added = 0;
    for (const e of incoming) {
      if (have.has(e.id)) continue;
      if (images[e.id]) { await setImg(e.id, images[e.id]); e.hasImage = true; } else if (e.hasImage && !(await getImg(e.id))) e.hasImage = false;
      S.errors.push(e); added++;
    }
    const mergeById = (cur, inc) => { const ids = new Set(cur.map(x => x.id)); return cur.concat((inc || []).filter(x => x && !ids.has(x.id))); };
    S.scores = mergeById(S.scores, data.scores);
    S.exams = mergeById(S.exams, data.exams);
    S.checklistItems = mergeById(S.checklistItems, data.checklistItems || data.checklistItemsV1);
    if (!S.checklistItems.length) S.checklistItems = JSON.parse(JSON.stringify(DEFAULT_CHECKLIST));
    if (!S.exams.length) S.exams = JSON.parse(JSON.stringify(DEFAULT_EXAMS));
    S.notes = Object.assign({}, data.calendarNotes || data.notes || {}, S.notes);
    S.checklistState = Object.assign({}, data.checklist || data.checklistState || {}, S.checklistState);
    if (data.reviewDays) { S.meta.reviewDays = S.meta.reviewDays || {}; for (const [d, n] of Object.entries(data.reviewDays)) S.meta.reviewDays[d] = Math.max(S.meta.reviewDays[d] || 0, n); }
    await persist('errors', 'scores', 'exams', 'checklistItems', 'notes', 'checklistState', 'meta');
    toast(`匯入完成：新增 ${added} 題`, 'success');
    refreshAll();
    ensureEnhanced();
  } catch (e) { toast('匯入失敗：' + e.message, 'error'); }
}

// =====================================================================
// 啟動
// =====================================================================
window.addEventListener('DOMContentLoaded', async () => {
  hydrateIcons();
  try {
    await loadState();
    if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
  } catch (e) {
    toast('無法開啟資料庫：' + e.message + '（若是無痕模式請改用一般模式）', 'error');
  }
  renderHeader();
  switchTab((location.hash || '#home').slice(1));
  ensureEnhanced().then(n => { if (n) toast(`已把 ${n} 張截圖調整得更清楚`, 'success'); });
  S.errors.forEach(e => { if (e.ai === 'running') e.ai = 'pending'; });
  bgAnalyze();
  // KaTeX 載入較晚時補算數學式
  window.addEventListener('load', () => renderMath($('main')));
  // 跨日自動更新
  let day = todayKey();
  setInterval(() => { if (todayKey() !== day) { day = todayKey(); renderHeader(); renderNav(); if (currentTab === 'home' && !RV.active) renderHome(); } }, 60000);
});
